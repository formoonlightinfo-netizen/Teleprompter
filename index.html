<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Teleprompter</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<style>
  :root{
    --bg:#000;
    --panel:#111214;
    --panel-2:#1b1c1f;
    --text:#f5f5f5;
    --accent:#ffd21f;
    --muted:#8a8d93;
    --danger:#ff4d4f;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    height:100%;
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior:none;
    touch-action:manipulation;
  }
  #app{position:fixed; inset:0; overflow:hidden; background:#000;}

  /* ---------- CAMERA BACKGROUND ---------- */
  #camera-video{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    background:#000;
    transform:scale(var(--zoom, 1));
    z-index:0;
  }
  #camera-video.mirror-preview{transform:scaleX(-1) scale(var(--zoom, 1));}
  .camera-dim{
    position:absolute; inset:0;
    background:rgba(0,0,0,.1);
    pointer-events:none;
    z-index:1;
  }

  /* ---------- floating, draggable, resizable prompter box ---------- */
  #reader{
    position:absolute;
    top:12%; left:6%; right:6%; bottom:auto;
    height:26vh; min-height:90px; max-height:80vh;
    min-width:160px; max-width:92vw;
    background:rgba(15,15,17,.62);
    border-radius:18px;
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 8px 24px rgba(0,0,0,.35);
    z-index:2;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    touch-action:pan-y;
  }
  #reader::-webkit-scrollbar{display:none;}
  #reader.box-collapsed{ height:34px; overflow:hidden; }

  #reader-inner{ padding:34px 16px 18px; }

  #prompter-text{
    color:var(--text);
    font-weight:600;
    white-space:pre-wrap;
    word-wrap:break-word;
    text-align:left;
    outline:none;
    min-height:1.4em;
    text-shadow: 0 2px 8px rgba(0,0,0,.9), 0 0 18px rgba(0,0,0,.75);
  }
  #prompter-text:empty:before{
    content:"Tocca qui e scrivi il tuo testo...";
    color:rgba(255,255,255,.45);
    font-weight:500;
  }
  #prompter-text[contenteditable="true"]{
    -webkit-user-select:text; user-select:text;
  }
  @media (orientation: landscape){
    #prompter-text{ text-align:center; }
  }

  #box-header{
    position:absolute; top:0; left:0; right:0; height:32px;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:4px 8px;
    z-index:3;
    cursor:grab;
    touch-action:none;
    background:linear-gradient(rgba(0,0,0,.28), transparent);
    border-radius:18px 18px 0 0;
  }
  #box-header .drag-grip{
    flex:1; height:4px; background:rgba(255,255,255,.5); border-radius:4px;
  }
  #box-header button{
    width:24px; height:24px; border-radius:50%; flex-shrink:0;
    background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.2); color:#fff; font-size:12px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }

  #resize-handle{
    position:absolute; left:0; right:0; bottom:0; height:20px;
    z-index:3; cursor:ns-resize; touch-action:none;
    display:flex; align-items:center; justify-content:center;
  }
  #resize-handle .resize-grip{
    width:36px; height:4px; background:rgba(255,255,255,.5); border-radius:4px;
  }

  /* ---------- top bar ---------- */
  #topbar{
    position:absolute; top:0; left:0; right:0;
    padding: calc(var(--safe-top) + 8px) calc(var(--safe-right) + 12px) 8px calc(var(--safe-left) + 12px);
    display:flex; align-items:center; justify-content:space-between;
    z-index:4;
    background:linear-gradient(rgba(0,0,0,.65), transparent);
    pointer-events:none;
  }
  #topbar > *{pointer-events:auto;}
  .icon-btn{
    width:40px; height:40px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(20,20,20,.6);
    color:var(--text);
    display:flex; align-items:center; justify-content:center;
    font-size:18px;
    cursor:pointer;
  }
  #progress-wrap{
    flex:1; margin:0 10px; height:4px; background:rgba(255,255,255,.15); border-radius:4px; overflow:hidden;
  }
  #progress-bar{height:100%; width:0%; background:var(--accent);}

  #rec-indicator{
    display:none;
    align-items:center; gap:6px;
    background:rgba(0,0,0,.6);
    border:1px solid rgba(255,77,79,.6);
    border-radius:20px;
    padding:6px 12px;
    font-size:13px;
    font-weight:600;
    color:#fff;
  }
  #rec-indicator.on{display:flex;}
  #rec-indicator .rec-dot{
    width:9px; height:9px; border-radius:50%; background:var(--danger);
    animation: rec-pulse 1s infinite;
  }
  @keyframes rec-pulse{ 0%,100%{opacity:1;} 50%{opacity:.25;} }

  /* ---------- bottom camera bar ---------- */
  #camera-bar{
    position:absolute; left:0; right:0; bottom:0;
    padding:10px 0 calc(var(--safe-bottom) + 18px) 0;
    display:flex; flex-direction:column; gap:10px;
    z-index:4;
    background:linear-gradient(transparent, rgba(0,0,0,.6) 55%);
  }
  #zoom-row{
    align-self:center;
    width:min(260px, 80vw);
    display:flex; align-items:center; gap:8px;
    background:rgba(20,20,20,.55);
    border:1px solid rgba(255,255,255,.18);
    border-radius:20px;
    padding:4px 14px;
  }
  #zoom-row .zoom-icon{ font-size:14px; flex-shrink:0; }
  #zoom-row input[type=range]{ flex:1; min-width:0; accent-color:var(--accent); height:30px; margin:0; }

  #camera-buttons-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:0 calc(var(--safe-right) + 28px) 0 calc(var(--safe-left) + 28px);
  }
  #cam-record-btn{
    width:72px; height:72px; border-radius:50%;
    background:var(--danger); border:4px solid #fff;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  #cam-record-btn .dot{ width:26px; height:26px; border-radius:50%; background:#fff; transition:border-radius .15s ease, width .15s ease, height .15s ease; }
  #cam-record-btn.recording .dot{ border-radius:6px; width:22px; height:22px; }

  .cam-side-btn{
    width:48px; height:48px; border-radius:50%;
    background:rgba(20,20,20,.55); border:1px solid rgba(255,255,255,.18);
    color:#fff; font-size:18px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .cam-side-btn:disabled{ opacity:.35; }
  #mirror-toggle-btn.active{
    background:var(--accent); border-color:var(--accent); color:#161616;
  }

  /* ---------- save banner ---------- */
  #save-banner{
    display:none;
    align-items:center; justify-content:space-between; gap:12px;
    position:absolute;
    left:50%; bottom:calc(var(--safe-bottom) + 108px);
    transform:translateX(-50%);
    z-index:11;
    background:rgba(20,20,20,.96);
    border:1px solid rgba(255,255,255,.18);
    border-radius:16px;
    padding:12px 14px;
    width:min(340px, 88vw);
    box-shadow:0 8px 24px rgba(0,0,0,.5);
  }
  #save-banner.show{ display:flex; }
  #save-banner span{ font-size:14px; font-weight:600; flex-shrink:0; }
  .save-banner-buttons{ display:flex; gap:8px; }
  #save-discard-btn, #save-confirm-btn{
    border:none; border-radius:10px; padding:9px 12px; font-size:13px; font-weight:600; cursor:pointer;
  }
  #save-discard-btn{ background:rgba(255,255,255,.1); color:var(--text); }
  #save-confirm-btn{ background:var(--accent); color:#161616; }

  /* ---------- settings popover ---------- */
  #settings-popover{
    display:none;
    flex-direction:column; gap:10px;
    position:absolute;
    left:50%; bottom:calc(var(--safe-bottom) + 108px);
    transform:translateX(-50%);
    z-index:5;
    background:rgba(20,20,20,.94);
    border:1px solid rgba(255,255,255,.15);
    border-radius:16px;
    padding:14px;
    width:min(300px, 84vw);
  }
  #settings-popover.open{ display:flex; }
  .ctrl-row{
    display:flex; align-items:center; gap:10px;
    background:rgba(255,255,255,.06);
    border-radius:12px;
    padding:6px 12px;
  }
  .ctrl-row span.lbl{font-size:12px; color:var(--muted); width:46px; flex-shrink:0;}
  .ctrl-row input[type=range]{flex:1; min-width:0; accent-color:var(--accent); height:34px; margin:0;}

  /* ---------- start overlay ---------- */
  #start-overlay{
    position:absolute; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px;
    padding: calc(var(--safe-top) + 24px) 32px calc(var(--safe-bottom) + 24px);
    background:#000;
    text-align:center;
  }
  #start-overlay.hidden{ display:none; }
  #start-overlay .dot{width:14px;height:14px;border-radius:50%;background:var(--accent);}
  #start-overlay h1{font-size:22px; margin:0; font-weight:700;}
  #start-overlay p{margin:0; font-size:13.5px; color:var(--muted); line-height:1.5; max-width:320px;}
  #start-btn{
    padding:16px 36px;
    border:none;
    border-radius:14px;
    background:var(--accent);
    color:#161616;
    font-size:17px;
    font-weight:700;
    cursor:pointer;
  }
  #start-btn:active{opacity:.85;}
</style>
</head>
<body>
<div id="app">

  <video id="camera-video" playsinline autoplay muted></video>
  <div class="camera-dim"></div>

  <div id="reader">
    <div id="box-header">
      <button id="box-hide-btn" title="Nascondi/mostra testo">👁</button>
      <div class="drag-grip"></div>
      <button id="box-settings-btn" title="Impostazioni">⚙</button>
    </div>
    <div id="reader-inner">
      <div id="prompter-text" contenteditable="true"></div>
    </div>
    <div id="resize-handle">
      <div class="resize-grip"></div>
    </div>
  </div>

  <div id="topbar">
    <button class="icon-btn" id="stop-btn" title="Ferma">✕</button>
    <div id="rec-indicator"><span class="rec-dot"></span><span id="rec-time">00:00</span></div>
    <div id="progress-wrap"><div id="progress-bar"></div></div>
    <button class="icon-btn" id="restart-btn" title="Riavvia">↺</button>
  </div>

  <div id="settings-popover">
    <div class="ctrl-row">
      <span class="lbl">Vel.</span>
      <input type="range" id="pb-speed" min="1" max="20" step="1" value="5">
    </div>
    <div class="ctrl-row">
      <span class="lbl">Testo</span>
      <input type="range" id="pb-size" min="14" max="80" step="1" value="26">
    </div>
  </div>

  <div id="camera-bar">
    <div id="zoom-row">
      <span class="zoom-icon">🔍</span>
      <input type="range" id="pb-zoom" min="1" max="2.2" step="0.05" value="1">
    </div>
    <div id="camera-buttons-row">
      <button class="cam-side-btn" id="switch-camera-btn" title="Cambia fotocamera">🔄</button>
      <button id="cam-record-btn" title="Registra"><span class="dot"></span></button>
      <button class="cam-side-btn" id="mirror-toggle-btn" type="button" title="Specchia video salvato">🪞</button>
    </div>
  </div>

  <div id="save-banner">
    <span>Video pronto</span>
    <div class="save-banner-buttons">
      <button id="save-discard-btn" title="Scarta">Scarta</button>
      <button id="save-confirm-btn" title="Salva">Salva video</button>
    </div>
  </div>

  <div id="start-overlay">
    <div class="dot"></div>
    <h1>Teleprompter Fotocamera</h1>
    <p>Apri direttamente sulla fotocamera con il teleprompter incorporato: scrivi il testo dentro il riquadro, spostalo e ridimensionalo dove vuoi, poi registra. Servirà il permesso di fotocamera e microfono.</p>
    <button id="start-btn">Tocca per iniziare</button>
  </div>

</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  const startOverlay = $('start-overlay');
  const startBtn = $('start-btn');

  const cameraVideo = $('camera-video');
  const reader = $('reader');
  const readerInner = $('reader-inner');
  const promptText = $('prompter-text');
  const boxHeader = $('box-header');
  const boxHideBtn = $('box-hide-btn');
  const boxSettingsBtn = $('box-settings-btn');
  const resizeHandle = $('resize-handle');

  const stopBtn = $('stop-btn');
  const restartBtn = $('restart-btn');
  const progressBar = $('progress-bar');
  const recIndicator = $('rec-indicator');
  const recTimeEl = $('rec-time');

  const settingsPopover = $('settings-popover');
  const pbZoom = $('pb-zoom');
  const pbSpeed = $('pb-speed');
  const pbSize = $('pb-size');

  const switchCameraBtn = $('switch-camera-btn');
  const camRecordBtn = $('cam-record-btn');
  const mirrorToggleBtn = $('mirror-toggle-btn');

  const saveBanner = $('save-banner');
  const saveDiscardBtn = $('save-discard-btn');
  const saveConfirmBtn = $('save-confirm-btn');

  const state = {
    speed: 5,
    size: 26,
    zoom: 1,
    facingMode: 'user',
    playing: false,
    recording: false,
    mirrorSave: false,
  };

  // ---------- persistence ----------
  const STORAGE_KEY = 'teleprompter-settings-v2';
  function loadSettings(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return;
      const s = JSON.parse(raw);
      if(s.speed) state.speed = s.speed;
      if(s.size) state.size = s.size;
      if(s.zoom) state.zoom = s.zoom;
      if(s.facingMode) state.facingMode = s.facingMode;
      if(typeof s.mirrorSave === 'boolean') state.mirrorSave = s.mirrorSave;
      if(typeof s.text === 'string') promptText.innerText = s.text;
    }catch(e){}
  }
  function saveSettings(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        speed: state.speed, size: state.size, zoom: state.zoom,
        facingMode: state.facingMode, mirrorSave: state.mirrorSave,
        text: promptText.innerText
      }));
    }catch(e){}
  }

  function syncUI(){
    pbSpeed.value = state.speed;
    pbSize.value = state.size;
    pbZoom.value = state.zoom;
    promptText.style.fontSize = state.size + 'px';
    cameraVideo.style.setProperty('--zoom', state.zoom);
    mirrorToggleBtn.classList.toggle('active', state.mirrorSave);
    updateMainButtonIcon();
  }

  loadSettings();
  syncUI();

  pbSpeed.addEventListener('input', () => { state.speed = +pbSpeed.value; syncUI(); saveSettings(); });
  pbSize.addEventListener('input', () => { state.size = +pbSize.value; syncUI(); saveSettings(); });
  pbZoom.addEventListener('input', () => { state.zoom = +pbZoom.value; syncUI(); saveSettings(); });
  mirrorToggleBtn.addEventListener('click', () => { state.mirrorSave = !state.mirrorSave; syncUI(); saveSettings(); });

  promptText.addEventListener('input', saveSettings);

  // plain-text paste only: avoid pulling in rich formatting from the clipboard
  promptText.addEventListener('paste', (e) => {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text);
  });

  boxHideBtn.addEventListener('click', () => {
    reader.classList.toggle('box-collapsed');
  });
  boxSettingsBtn.addEventListener('click', () => {
    settingsPopover.classList.toggle('open');
  });

  // don't let a tap on the box toggle play/pause when it lands on the header controls
  reader.addEventListener('click', (e) => {
    if(e.target.closest('#box-header') || e.target.closest('#resize-handle')) return;
  });

  // ---------- move the box up/down by its header ----------
  // width stays fixed and centered (left/right come from CSS) - only the
  // vertical position ever changes, so the box never drifts off-center
  (function setupBoxDrag(){
    let dragging = false, startY = 0, startTop = 0;

    function onDown(clientY, target){
      if(target.closest('button')) return false;
      dragging = true;
      const r = reader.getBoundingClientRect();
      startY = clientY;
      startTop = r.top;
      reader.style.top = startTop + 'px';
      return true;
    }
    function onMove(clientY){
      if(!dragging) return;
      const dy = clientY - startY;
      const bh = reader.offsetHeight;
      let nt = startTop + dy;
      nt = Math.max(4, Math.min(window.innerHeight - bh - 4, nt));
      reader.style.top = nt + 'px';
    }
    function onUp(){ dragging = false; }

    boxHeader.addEventListener('pointerdown', (e) => {
      if(onDown(e.clientY, e.target)){
        try{ boxHeader.setPointerCapture(e.pointerId); }catch(_){}
      }
    });
    boxHeader.addEventListener('pointermove', (e) => onMove(e.clientY));
    boxHeader.addEventListener('pointerup', onUp);
    boxHeader.addEventListener('pointercancel', onUp);

    // touch fallback for browsers/webviews with partial Pointer Events support
    boxHeader.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      if(onDown(t.clientY, e.target)) e.preventDefault();
    }, { passive:false });
    boxHeader.addEventListener('touchmove', (e) => {
      if(!dragging) return;
      e.preventDefault();
      const t = e.touches[0];
      onMove(t.clientY);
    }, { passive:false });
    boxHeader.addEventListener('touchend', onUp);
    boxHeader.addEventListener('touchcancel', onUp);
  })();

  // ---------- resize the box's height only, from the bottom edge ----------
  // width/centering are never touched here either
  (function setupBoxResize(){
    let resizing = false, startY = 0, startH = 0;

    function onDown(clientY){
      resizing = true;
      const r = reader.getBoundingClientRect();
      startY = clientY;
      startH = r.height;
    }
    function onMove(clientY){
      if(!resizing) return;
      const dy = clientY - startY;
      const rect = reader.getBoundingClientRect();
      const maxH = window.innerHeight - rect.top - 4;
      const nh = Math.max(90, Math.min(maxH, startH + dy));
      reader.style.height = nh + 'px';
    }
    function onUp(){ resizing = false; }

    resizeHandle.addEventListener('pointerdown', (e) => {
      onDown(e.clientY);
      try{ resizeHandle.setPointerCapture(e.pointerId); }catch(_){}
    });
    resizeHandle.addEventListener('pointermove', (e) => onMove(e.clientY));
    resizeHandle.addEventListener('pointerup', onUp);
    resizeHandle.addEventListener('pointercancel', onUp);

    resizeHandle.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const t = e.touches[0];
      onDown(t.clientY);
    }, { passive:false });
    resizeHandle.addEventListener('touchmove', (e) => {
      if(!resizing) return;
      e.preventDefault();
      const t = e.touches[0];
      onMove(t.clientY);
    }, { passive:false });
    resizeHandle.addEventListener('touchend', onUp);
    resizeHandle.addEventListener('touchcancel', onUp);
  })();

  function resetBoxGeometry(){
    reader.style.top = ''; reader.style.height = '';
    reader.classList.remove('box-collapsed');
    settingsPopover.classList.remove('open');
  }

  // ---------- wake lock ----------
  // held while reading OR recording, so pausing the scroll (or the script
  // ending) never lets the screen lock mid-recording and kill the camera
  let wakeLock = null;
  async function requestWakeLock(){
    try{
      if('wakeLock' in navigator){
        wakeLock = await navigator.wakeLock.request('screen');
      }
    }catch(e){ /* ignore, not critical */ }
  }
  function releaseWakeLock(){
    if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock = null; }
  }
  function syncWakeLock(){
    const shouldHold = state.playing || state.recording;
    if(shouldHold && !wakeLock) requestWakeLock();
    else if(!shouldHold && wakeLock) releaseWakeLock();
  }
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible' && (state.playing || state.recording)) requestWakeLock();
  });

  // ---------- camera + recording ----------
  let cameraStream = null;
  let mediaRecorder = null;
  let recordedChunks = [];
  let recStartTs = null;
  let recTimerId = null;

  // No resolution/aspectRatio constraints: let the camera pick its own
  // widest natural framing instead of forcing a crop. Getting the exact
  // output shape right is handled separately below by drawing the video
  // onto a canvas at record time, so the camera stream itself doesn't need
  // to match the screen orientation.
  function videoConstraintsForScreen(){
    return { facingMode: state.facingMode };
  }

  // make sure the video element actually has decoded pixel data (videoWidth
  // > 0) before we size/draw the recording canvas from it
  function waitForVideoReady(){
    if(cameraVideo.videoWidth > 0) return Promise.resolve();
    return new Promise((resolve) => {
      const done = () => { cameraVideo.removeEventListener('loadeddata', done); resolve(); };
      cameraVideo.addEventListener('loadeddata', done);
      setTimeout(done, 1500); // fallback in case the event never fires
    });
  }

  async function startCamera(){
    stopCameraStream();
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      alert('Questo browser non supporta la fotocamera dal web. Prova con Chrome o Safari aggiornati.');
      return false;
    }
    try{
      cameraStream = await navigator.mediaDevices.getUserMedia({
        video: videoConstraintsForScreen(),
        audio: true
      });
      cameraVideo.srcObject = cameraStream;
      cameraVideo.classList.toggle('mirror-preview', state.facingMode === 'user');
      await requestWidestZoom();
      await waitForVideoReady();
      setupRecordCanvas();
      return true;
    }catch(e){
      alert('Impossibile accedere alla fotocamera o al microfono. Controlla i permessi del browser per questo sito.');
      return false;
    }
  }

  // ---------- record-time canvas pipeline ----------
  // The camera's raw stream is displayed directly (mirrored for a natural
  // selfie view), but what actually gets *recorded* is a canvas that we
  // redraw every frame: cropped to the phone's current orientation (so the
  // saved file is never the wrong shape) and always drawn un-mirrored (so
  // the saved file always reads correctly, regardless of the mirrored
  // preview). The zoom slider crops this same canvas draw, so what's
  // recorded always matches what's on screen.
  let recordCanvas = null, recordCtx = null, canvasStream = null, drawRafId = null;

  function setupRecordCanvas(){
    const isPortrait = window.innerHeight >= window.innerWidth;
    if(!recordCanvas){
      recordCanvas = document.createElement('canvas');
      recordCtx = recordCanvas.getContext('2d');
    }
    recordCanvas.width = isPortrait ? 720 : 1280;
    recordCanvas.height = isPortrait ? 1280 : 720;
  }

  function computeCoverCrop(vw, vh, targetAspect, zoom){
    let cropW, cropH;
    if(vw / vh > targetAspect){ cropH = vh; cropW = vh * targetAspect; }
    else { cropW = vw; cropH = vw / targetAspect; }
    cropW /= zoom; cropH /= zoom;
    return { sx: (vw - cropW) / 2, sy: (vh - cropH) / 2, sw: cropW, sh: cropH };
  }

  function startDrawLoop(){
    if(drawRafId) return;
    function draw(){
      if(recordCtx && cameraVideo.videoWidth){
        const c = computeCoverCrop(cameraVideo.videoWidth, cameraVideo.videoHeight, recordCanvas.width / recordCanvas.height, state.zoom);
        // Whether the front camera's raw track needs an extra horizontal
        // flip to save correctly varies by device/browser and can't be
        // reliably detected from code, so it's a user-toggled setting
        // ("Specchia video salvato") instead of a hardcoded guess.
        if(state.facingMode === 'user' && state.mirrorSave){
          recordCtx.save();
          recordCtx.translate(recordCanvas.width, 0);
          recordCtx.scale(-1, 1);
          recordCtx.drawImage(cameraVideo, c.sx, c.sy, c.sw, c.sh, 0, 0, recordCanvas.width, recordCanvas.height);
          recordCtx.restore();
        } else {
          recordCtx.drawImage(cameraVideo, c.sx, c.sy, c.sw, c.sh, 0, 0, recordCanvas.width, recordCanvas.height);
        }
      }
      drawRafId = requestAnimationFrame(draw);
    }
    drawRafId = requestAnimationFrame(draw);
  }
  function stopDrawLoop(){
    if(drawRafId){ cancelAnimationFrame(drawRafId); drawRafId = null; }
  }

  // some Android/Chrome cameras start already zoomed in past their widest
  // point; where the hardware exposes a zoom capability, pull it back to its
  // minimum (widest) setting. No-op where the browser doesn't expose this
  // (notably iOS Safari, which has no web API for camera zoom at all).
  async function requestWidestZoom(){
    try{
      const track = cameraStream && cameraStream.getVideoTracks()[0];
      if(!track || !track.getCapabilities) return;
      const caps = track.getCapabilities();
      if(caps && caps.zoom && typeof caps.zoom.min === 'number'){
        await track.applyConstraints({ advanced: [{ zoom: caps.zoom.min }] });
      }
    }catch(e){ /* zoom control not supported here, ignore */ }
  }

  function stopCameraStream(){
    stopDrawLoop();
    if(cameraStream){
      cameraStream.getTracks().forEach((t) => t.stop());
      cameraStream = null;
    }
    if(canvasStream){
      canvasStream.getTracks().forEach((t) => t.stop());
      canvasStream = null;
    }
    cameraVideo.srcObject = null;
  }

  // re-acquire the camera stream on rotation so the recorded video matches the
  // phone's current orientation, and snap the box back to a sane default spot/size
  let orientationRestartTimer = null;
  window.addEventListener('resize', () => {
    if(!startOverlay.classList.contains('hidden')) return;
    resetBoxGeometry();
    if(state.recording) return;
    clearTimeout(orientationRestartTimer);
    orientationRestartTimer = setTimeout(() => { startCamera(); }, 400);
  });

  switchCameraBtn.addEventListener('click', async () => {
    if(state.recording) return;
    state.facingMode = state.facingMode === 'user' ? 'environment' : 'user';
    saveSettings();
    await startCamera();
  });

  function pickMimeType(){
    if(!window.MediaRecorder) return '';
    const candidates = [
      'video/mp4;codecs=h264,aac',
      'video/mp4',
      'video/webm;codecs=vp9,opus',
      'video/webm;codecs=vp8,opus',
      'video/webm'
    ];
    for(const c of candidates){
      if(MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)) return c;
    }
    return '';
  }

  function formatTime(sec){
    const m = Math.floor(sec / 60).toString().padStart(2,'0');
    const s = Math.floor(sec % 60).toString().padStart(2,'0');
    return m + ':' + s;
  }

  function updateRecTimer(){
    const elapsed = (Date.now() - recStartTs) / 1000;
    recTimeEl.textContent = formatTime(elapsed);
  }

  function startRecording(){
    if(!cameraStream || !window.MediaRecorder || !recordCanvas) return;
    recordedChunks = [];

    startDrawLoop();
    if(!canvasStream) canvasStream = recordCanvas.captureStream(30);
    canvasStream.getAudioTracks().forEach((t) => canvasStream.removeTrack(t));
    const audioTrack = cameraStream.getAudioTracks()[0];
    if(audioTrack) canvasStream.addTrack(audioTrack);

    const mimeType = pickMimeType();
    try{
      mediaRecorder = mimeType ? new MediaRecorder(canvasStream, { mimeType }) : new MediaRecorder(canvasStream);
    }catch(e){
      alert('La registrazione video non è supportata su questo browser.');
      stopDrawLoop();
      return;
    }
    mediaRecorder.ondataavailable = (e) => { if(e.data && e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = handleRecordingStop;
    mediaRecorder.start(1000);
    state.recording = true;
    promptText.contentEditable = 'false';
    recIndicator.classList.add('on');
    updateMainButtonIcon();
    syncWakeLock();
    recStartTs = Date.now();
    recTimeEl.textContent = '00:00';
    recTimerId = setInterval(updateRecTimer, 250);
    switchCameraBtn.disabled = true;
  }

  function stopRecording(){
    if(mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    stopDrawLoop();
    state.recording = false;
    recIndicator.classList.remove('on');
    updateMainButtonIcon();
    syncWakeLock();
    clearInterval(recTimerId);
    switchCameraBtn.disabled = false;
  }

  // navigator.share()/downloads only work reliably when triggered directly
  // by a user tap. mediaRecorder.onstop fires asynchronously, well after the
  // stop button's click has finished, so calling share() from here silently
  // fails on iOS Safari (expired "user activation") and nothing appears to
  // happen. Instead, hold onto the finished video and show a banner with a
  // real button the user taps, so the save action has its own fresh gesture.
  let pendingVideo = null;
  function handleRecordingStop(){
    if(recordedChunks.length === 0) return;
    const mimeType = (mediaRecorder && mediaRecorder.mimeType) || 'video/webm';
    const blob = new Blob(recordedChunks, { type: mimeType });
    const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
    const filename = `teleprompter-${Date.now()}.${ext}`;
    pendingVideo = { blob, filename, mimeType };
    saveBanner.classList.add('show');
  }

  async function saveVideoNow(){
    if(!pendingVideo) return;
    const { blob, filename, mimeType } = pendingVideo;
    let shared = false;
    try{
      const file = new File([blob], filename, { type: mimeType });
      if(navigator.canShare && navigator.canShare({ files: [file] })){
        await navigator.share({ files: [file], title: 'Video Teleprompter' });
        shared = true;
      }
    }catch(e){ /* share sheet cancelled or unavailable, fall back to download */ }

    if(!shared){
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    }
    pendingVideo = null;
    saveBanner.classList.remove('show');
  }

  saveConfirmBtn.addEventListener('click', saveVideoNow);
  saveDiscardBtn.addEventListener('click', () => {
    pendingVideo = null;
    saveBanner.classList.remove('show');
  });

  // ---------- scrolling engine ----------
  let rafId = null;
  let lastTs = null;
  // pixel/second baseline; speed 1..20 maps roughly 12..300 px/s
  function speedToPxPerSec(sp){
    return 10 + (sp * sp) * 0.8;
  }

  function step(ts){
    if(!state.playing){ rafId = null; return; }
    if(lastTs === null) lastTs = ts;
    const dt = (ts - lastTs) / 1000;
    lastTs = ts;
    const pxPerSec = speedToPxPerSec(state.speed);
    reader.scrollTop += pxPerSec * dt;
    updateProgress();
    if(reader.scrollTop + reader.clientHeight >= reader.scrollHeight - 2){
      pause();
      return;
    }
    rafId = requestAnimationFrame(step);
  }

  function updateProgress(){
    const max = reader.scrollHeight - reader.clientHeight;
    const pct = max > 0 ? Math.min(100, (reader.scrollTop / max) * 100) : 0;
    progressBar.style.width = pct + '%';
  }

  function updateMainButtonIcon(){
    camRecordBtn.classList.toggle('recording', state.recording);
  }

  function play(){
    if(state.playing) return;
    state.playing = true;
    promptText.contentEditable = 'false';
    lastTs = null;
    syncWakeLock();
    rafId = requestAnimationFrame(step);
  }
  function pause(){
    state.playing = false;
    if(!state.recording) promptText.contentEditable = 'true';
    if(rafId) cancelAnimationFrame(rafId);
    rafId = null;
    syncWakeLock();
  }

  function handleMainButton(){
    if(!state.recording){
      startRecording();
      if(!state.playing) play();
    } else {
      stopRecording();
      pause();
    }
  }
  camRecordBtn.addEventListener('click', handleMainButton);

  restartBtn.addEventListener('click', () => {
    reader.scrollTop = 0;
    updateProgress();
  });

  reader.addEventListener('scroll', updateProgress);

  // ---------- start / stop ----------
  async function startApp(){
    startOverlay.classList.add('hidden');
    document.documentElement.requestFullscreen?.().catch(()=>{});
    resetBoxGeometry();
    await startCamera();
    reader.scrollTop = 0;
    updateProgress();
  }

  function stopApp(){
    if(state.recording) stopRecording();
    pause();
    stopCameraStream();
    if(document.fullscreenElement) document.exitFullscreen?.().catch(()=>{});
    startOverlay.classList.remove('hidden');
  }

  startBtn.addEventListener('click', startApp);
  stopBtn.addEventListener('click', stopApp);

  // ---------- keyboard shortcuts (useful with bluetooth remote / external keyboard) ----------
  document.addEventListener('keydown', (e) => {
    if(startOverlay && !startOverlay.classList.contains('hidden')) return;
    if(e.code === 'Space' && document.activeElement !== promptText){
      e.preventDefault();
      state.playing ? pause() : play();
    }
    else if(e.code === 'ArrowUp'){ state.speed = Math.min(20, state.speed+1); syncUI(); saveSettings(); }
    else if(e.code === 'ArrowDown'){ state.speed = Math.max(1, state.speed-1); syncUI(); saveSettings(); }
  });

  // ---------- register service worker (offline / installable) ----------
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
